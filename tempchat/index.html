<script>
    function generateId(len) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      return Array.from({length: len}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
    }

    function creteroom() {
      const chatroomid = generateId(16);
      const srvIndex = Math.floor(Math.random() * P2P_CONFIG.signalingServers.length);
      const key = generateHexKey();
      
      const hashParams = new URLSearchParams();
      hashParams.set("id", chatroomid);
      hashParams.set("key", key);
      hashParams.set("srv", srvIndex);
      
      window.location.href = "chat.html#" + hashParams.toString();
    }

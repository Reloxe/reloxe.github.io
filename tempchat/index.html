<script>
    function creteroom() {
      var chatroomid = Math.floor(Math.random() * (9999999999 - 111111111) ) + 111111111;
      var urln = new URL("chat.html", document.location.href);
      urln.searchParams.append("chat_id", chatroomid);
      
      // Select a random signaling server index from the pool
      var serverIndex = Math.floor(Math.random() * P2P_CONFIG.signalingServers.length);
      urln.searchParams.append("srv", serverIndex);

<script>
let peer = null;
let connections = {}; // peerId -> DataConnection
let isHost = false;
let myPeerId = null;
let chatRoomId = null;
let myNickname = null;
let parms = new URLSearchParams(document.location.search);

function connect_chat() {
  // Strip both query and hash safely to get clean base URL
  var baseUrl = document.location.href.split("?")[0].split("#")[0];
  var urln = new URL(baseUrl);
  urln.searchParams.append("chat_id", document.getElementById("chatroomin_id").value);
  urln.searchParams.append("nick", document.getElementById("nickname_id").value);
  
  let srv = parms.get("srv");
  if (srv === null || srv === undefined) {
    srv = Math.floor(Math.random() * P2P_CONFIG.signalingServers.length);
  }
  urln.searchParams.append("srv", srv);
  
  // Preserve hash if it exists, otherwise generate a new key
  let hash = document.location.hash;
  if (!hash) {
    hash = "#key=" + generateHexKey();
  }
  urln.hash = hash;

  document.location.replace(urln);
}

function escapeHTML(str) {
  if (!str) return "";
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;")
    .replace(/;/g, "&#59;");
}

function appendLocalMessage(msgText) {
  const escaped = escapeHTML(msgText);
  const container = document.getElementById("messages_id");
  container.innerHTML += '<a class="message_bizim">' + escaped + '</a>';
  container.scrollTop = container.scrollHeight;
}

function appendRemoteMessage(nickname, msgText) {
  const escapedNick = escapeHTML(nickname);
  const escapedMsg = escapeHTML(msgText);
  const container = document.getElementById("messages_id");
  container.innerHTML += '<a class="user_name_sender"><b>' + escapedNick + '</b></a> <a class="message_karsi_taraf">' + escapedMsg + '</a>';
  container.scrollTop = container.scrollHeight;
}

function appendSystemMessage(msgText) {
  const escapedMsg = escapeHTML(msgText);
  const container = document.getElementById("messages_id");
  container.innerHTML += '<div style="color: #007579; text-align: center; font-family: arimo; font-size: 14px; margin-bottom: 10px; padding: 5px;"><i>' + escapedMsg + '</i></div>';
  container.scrollTop = container.scrollHeight;
}

// Encrypt and send payload directly to a peer connection
async function sendEncrypted(conn, payload) {
  if (!conn || !conn.open) return;
  const plainText = JSON.stringify(payload);
  const encKey = getEncryptionKey();
  if (encKey) {
    const encrypted = await encryptData(plainText, encKey);
    conn.send(JSON.stringify({ encrypted: true, payload: encrypted }));
  } else {
    conn.send(JSON.stringify({ encrypted: false, payload: plainText }));
  }
}

// Encrypt and broadcast payload to all open peer connections
async function broadcast(payload) {
  const plainText = JSON.stringify(payload);
  let dataToSend;
  const encKey = getEncryptionKey();
  if (encKey) {
    const encrypted = await encryptData(plainText, encKey);
    dataToSend = JSON.stringify({ encrypted: true, payload: encrypted });
  } else {
    dataToSend = JSON.stringify({ encrypted: false, payload: plainText });
  }

  for (let peerId in connections) {
    if (connections[peerId] && connections[peerId].open) {
      connections[peerId].send(dataToSend);
    }
  }
}

async function send_msg() {
  const inputEl = document.getElementById("chat_input_id");
  const text = inputEl.value;
  if (!text) return;

  // Render locally immediately
  appendLocalMessage(text);
  inputEl.value = "";

  // Broadcast to all active connections
  const payload = {
    type: "chat",
    nickname: myNickname,
    msg: text
  };
  await broadcast(payload);
}

function initP2P(roomId, nickname, srvIndex) {
  myPeerId = roomId;
  const options = getPeerOptions(srvIndex);
  
  peer = new Peer(myPeerId, options);
  
  peer.on('open', (id) => {
    isHost = true;
    console.log("Registered as Host. Peer ID:", id);
    document.getElementById("chat_input_id").placeholder = "Message...";
    appendSystemMessage("You connected as Host. Waiting for other users to join...");
    setupHostListeners();
  });
  
  peer.on('error', (err) => {
    console.warn("PeerJS error:", err);
    if (err.type === 'unavailable-id') {
      // ID taken -> Guest mode
      isHost = false;
      peer.destroy();
      
      const randomId = roomId + "-" + Math.random().toString(36).substr(2, 9);
      myPeerId = randomId;
      
      peer = new Peer(myPeerId, options);
      
      peer.on('open', (id) => {
        console.log("Registered as Guest. Peer ID:", id);
        document.getElementById("chat_input_id").placeholder = "Connecting to host...";
        appendSystemMessage("Connecting to host...");
        connectToHost(roomId);
      });
      
      peer.on('error', (guestErr) => {
        console.error("Guest PeerJS error:", guestErr);
        appendSystemMessage("Connection error: " + guestErr.message);
      });
    } else {
      appendSystemMessage("Signaling error: " + err.message);
    }
  });
}

function setupHostListeners() {
  peer.on('connection', (conn) => {
    console.log("Guest connected to host:", conn.peer);
    setupConnectionEvents(conn);
  });
}

function connectToHost(hostId) {
  // Do NOT send nickname in metadata — it goes unencrypted to the signaling server
  const conn = peer.connect(hostId);
  setupConnectionEvents(conn);
}

// Track peers that have not yet sent a valid encrypted greet
let pendingAuth = {};

function setupConnectionEvents(conn) {
  connections[conn.peer] = conn;
  
  conn.on('open', async () => {
    console.log("DataChannel open with:", conn.peer);
    
    if (!isHost) {
      document.getElementById("chat_input_id").placeholder = "Message...";
      // Guest immediately sends greeting (encrypted) to let Host verify key
      await sendEncrypted(conn, {
        type: "greet",
        nickname: myNickname
      });
    } else {
      // Host: set a 10-second timeout — if no valid greet arrives, kick this peer
      pendingAuth[conn.peer] = setTimeout(() => {
        if (pendingAuth[conn.peer]) {
          console.warn("Peer " + conn.peer + " did not authenticate in time. Disconnecting.");
          conn.close();
          delete pendingAuth[conn.peer];
          delete connections[conn.peer];
        }
      }, 10000);
    }
  });
  
  conn.on('data', async (raw) => {
    try {
      const outer = JSON.parse(raw);
      const encKey = getEncryptionKey();
      
      // Enforce encryption if room has a key
      if (encKey && !outer.encrypted) {
        console.warn("Rejected unencrypted packet since encryption is enabled.");
        conn.close();
        return;
      }
      
      let plainText;
      if (outer.encrypted) {
        if (!encKey) {
          console.warn("Received encrypted packet but key is missing in URL.");
          conn.close();
          return;
        }
        plainText = await decryptData(outer.payload, encKey);
        // Check if decryption actually failed (wrong key)
        if (plainText === null || plainText.startsWith("[Şifre Çözme Başarısız")) {
          console.warn("Decryption failed for peer " + conn.peer + ". Wrong key — disconnecting.");
          conn.close();
          return;
        }
      } else {
        plainText = outer.payload;
      }
      
      const data = JSON.parse(plainText);
      
      if (data.type === "chat") {
        appendRemoteMessage(data.nickname, data.msg);
      } 
      else if (data.type === "greet") {
        if (isHost) {
          const newGuestId = conn.peer;
          const guestNick = data.nickname || "Guest";
          
          // Clear pending auth timeout — peer authenticated successfully
          if (pendingAuth[newGuestId]) {
            clearTimeout(pendingAuth[newGuestId]);
            delete pendingAuth[newGuestId];
          }
          
          appendSystemMessage(guestNick + " Connected.");
          
          const existingGuests = Object.keys(connections).filter(id => id !== newGuestId && connections[id] && connections[id].open);
          
          // Send welcome packet encrypted (contains peer list)
          await sendEncrypted(conn, {
            type: "welcome",
            peers: existingGuests,
            nickname: "System"
          });
          
          // Notify other existing guests about the new peer
          for (const otherId of existingGuests) {
            await sendEncrypted(connections[otherId], {
              type: "new-peer",
              peerId: newGuestId,
              nickname: "System"
            });
          }
        }
      }
      else if (data.type === "welcome") {
        appendSystemMessage("Member Connected.");
        const peerIds = data.peers || [];
        peerIds.forEach(id => {
          if (!connections[id]) {
            const guestConn = peer.connect(id);
            setupConnectionEvents(guestConn);
          }
        });
      } 
      else if (data.type === "new-peer") {
        const newPeerId = data.peerId;
        if (!connections[newPeerId]) {
          const guestConn = peer.connect(newPeerId);
          setupConnectionEvents(guestConn);
        }
      }
    } catch (e) {
      console.error("Error decrypting/processing data from " + conn.peer + ":", e);
      // Immediately disconnect unauthorized or erroring peer
      conn.close();
    }
  });
  
  conn.on('close', () => {
    console.log("Connection closed with:", conn.peer);
    handlePeerDisconnect(conn.peer);
  });

  conn.on('error', (err) => {
    console.error("Connection error with " + conn.peer + ":", err);
    handlePeerDisconnect(conn.peer);
  });
}

function handlePeerDisconnect(peerId) {
  if (connections[peerId]) {
    delete connections[peerId];
  }
  
  if (peerId === chatRoomId && !isHost) {
    appendSystemMessage("Host disconnected. Attempting to heal connection...");
    setTimeout(() => {
      healHost();
    }, 1500);
  } else {
    appendSystemMessage("Member Disconnected.");
  }
}

function healHost() {
  console.log("Attempting self-healing host...");
  if (peer) {
    peer.destroy();
  }
  connections = {};
  
  const srvIndex = parms.get("srv") || 0;
  const options = getPeerOptions(srvIndex);
  
  myPeerId = chatRoomId;
  peer = new Peer(myPeerId, options);
  
  peer.on('open', (id) => {
    isHost = true;
    console.log("Self-healing: Registered as the new Host!");
    appendSystemMessage("You are the new room host. Room is active again.");
    document.getElementById("chat_input_id").placeholder = "Message...";
    setupHostListeners();
  });
  
  peer.on('error', (err) => {
    console.warn("Self-healing error:", err);
    if (err.type === 'unavailable-id') {
      isHost = false;
      peer.destroy();
      
      const randomId = chatRoomId + "-" + Math.random().toString(36).substr(2, 9);
      myPeerId = randomId;
      
      peer = new Peer(myPeerId, options);
      peer.on('open', (id) => {
        console.log("Self-healing: Registered as Guest again.");
        appendSystemMessage("Reconnecting to the new host...");
        connectToHost(chatRoomId);
      });
    } else {
      appendSystemMessage("Reconnection failed: " + err.message);
    }
  });
}

function start_() {
  try {
    var shareId = parms.get("chat_id");
    var srvIndex = parms.get("srv") || 0;
    var currentOrigin = document.location.href.split("?")[0].split("#")[0];
    
    // Auto-generate key if missing on room load
    let encryptionKey = getEncryptionKey();
    if (!encryptionKey && shareId && parms.get("nick")) {
      encryptionKey = generateHexKey();
      document.location.hash = "key=" + encryptionKey;
    }
    
    // Build share link safely — escape to prevent XSS via crafted chat_id
    var rawLink = currentOrigin + "?chat_id=" + encodeURIComponent(shareId) + "&srv=" + encodeURIComponent(srvIndex) + document.location.hash;
    document.getElementById("shakerlink").textContent = "Share Chat Link: " + rawLink;
  } catch (error) {
    console.error(error);
  }

  chatRoomId = parms.get("chat_id");
  myNickname = parms.get("nick");

  if (chatRoomId == null || chatRoomId == undefined) {
    document.getElementById("chatpopup").style.display = "block";
    return;
  } else if (myNickname == null || myNickname == undefined) {
    document.getElementById("chatroomin_id").value = chatRoomId;
    document.getElementById("chatpopup").style.display = "block";
    return;
  }

  initP2P(chatRoomId, myNickname, srvIndex);

  var input_focused = false;
  document.addEventListener("keypress", (event) => {
    if (input_focused && event.keyCode == 13) {
      send_msg();
    }
  });

  document.getElementById("chat_input_id").addEventListener("focus", function() {
    input_focused = true;
  });

  document.getElementById("chat_input_id").addEventListener("focusout", function() {
    input_focused = false;
  });
}
</script>
